# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL Production Database (Flyway managed)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/upimesh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate: validate against Flyway migrations; never drop or auto-create in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis Configuration (Coordination & Dashboard Cache)
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=1000ms

# Logging with correlation ID support (MDC)
logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] [req:%X{requestId:-none}] %-5level %logger{36} - %msg%n

# Idempotency window (how long a packet hash is remembered)
upi.mesh.idempotency-ttl-seconds=86400

# Packet freshness window — anything older than this is rejected as replay
upi.mesh.packet-max-age-seconds=86400

# Phase 8: Spring Boot Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.access.default=unrestricted
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.DEGRADED=200
management.health.redis.enabled=false
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=upi-offline-mesh
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.upi.settlement.latency=true


