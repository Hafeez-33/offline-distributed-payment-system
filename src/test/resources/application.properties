server.port=8080

# Fast in-memory test database using H2 in PostgreSQL mode with Flyway validation
spring.datasource.url=jdbc:h2:mem:upimesh;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway runs migrations against H2 in PostgreSQL mode to verify V1 schema
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis in test: short timeout so if Redis is not running, fallback triggers quickly without blocking tests
spring.data.redis.repositories.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=100ms

# Logging
logging.level.com.demo.upimesh=INFO

# Idempotency & Freshness windows
upi.mesh.idempotency-ttl-seconds=86400
upi.mesh.packet-max-age-seconds=86400

# Phase 8: Spring Boot Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.access.default=unrestricted
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.DEGRADED=200
management.health.redis.enabled=false
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=upi-offline-mesh
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.upi.settlement.latency=true

